<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NoteManager - Create Note</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="top-bar">
    <div class="logo">NoteManager</div>
    <div class="user-info">useremail@mail.com</div>
</header>
<main class="dashboard">
    <div class="note-card" style="max-width: 600px; margin: 0 auto; padding: 25px; cursor: default; height: auto; min-height: fit-content;">
        <h2 style="margin-top: 0; margin-bottom: 20px;">Create note</h2>
        <form th:action="@{/note/add-note}" method="post" style="display: flex; flex-direction: column; gap: 15px;">
            <div style="display: flex; flex-direction: column;">
                <label for="title" style="margin-bottom: 5px; font-weight: 600;">Title:</label>
                <input type="text" id="title" name="title" th:value="${note.title}" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;" />
            </div>
            <div style="display: flex; flex-direction: column;">
                <label for="content" style="margin-bottom: 5px; font-weight: 600;">Content:</label>
                <textarea id="content" name="content" required th:text="${note.content}" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; min-height: 150px; font-size: 16px; resize: vertical;"></textarea>
            </div>
            <div style="display: flex; gap: 15px; margin-top: 10px;">
                <button type="submit" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Create</button>
                <a href="/note/list" style="padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; text-align: center; font-size: 16px; font-weight: bold;">Back to List</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
